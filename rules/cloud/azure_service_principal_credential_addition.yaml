id: azr-sec-004
title: Azure Service Principal Credential Manipulation (Backdoor)
description: Detects the addition of certificates or secrets to an existing Azure AD / Entra ID service principal or app registration, a common persistence and privilege escalation technique.
severity: CRITICAL
mitre_tactics:
  - Persistence
  - Privilege Escalation
mitre_techniques:
  - T1098.001
logsource:
  service: auditlogs
  product: azure
selection:
  operationName: "Add service principal credentials"
  result: "success"
containment_playbook:
  - "Immediately revoke the newly added certificate or password credential on the target service principal."
  - "Invalidate all active OAuth refresh tokens and session tokens issued to the compromised service principal."
  - "Audit Azure sign-in logs for API calls initiated using the compromised app registration within the last 72 hours."
  - "Quarantine Azure role assignments granted to the service principal to restrict blast radius."
